services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lumine
      POSTGRES_USER: lumine
      POSTGRES_PASSWORD: lumine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumine -d lumine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: